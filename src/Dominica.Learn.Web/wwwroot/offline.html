<!doctype html>
<html lang="pt-BR">
<!-- A PÁGINA QUE APARECE SEM CONEXÃO — e ela é HONESTA sobre o porquê.

     O Learn é Blazor Server: cada tela vem do servidor, porque as suas notas moram no SEU vault (os
     arquivos .md no disco do servidor) e a revisão GRAVA nelas. Um "modo offline" que fingisse
     funcionar mostraria uma fila velha e perderia respostas — pior que dizer a verdade.

     AUTOSSUFICIENTE de propósito: sem CSS externo, sem fonte, sem imagem de fora. É a única página
     que precisa abrir quando NADA mais abre — qualquer dependência seria o jeito de ela falhar junto. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem conexão · Dominica Learn</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #F7F4EE; color: #0E1E33;
    }
    @media (prefers-color-scheme: dark) { body { background: #0f1720; color: #ECE7DB; } }
    main { text-align: center; padding: 24px; max-width: 26rem; }
    h1 { font-size: 1.25rem; margin: 16px 0 8px; }
    p { line-height: 1.5; margin: 0 0 20px; opacity: .85; }
    button {
      font: inherit; padding: 10px 22px; border-radius: 8px; cursor: pointer;
      border: 1px solid #C9A24A; background: #C9A24A; color: #0E1E33; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
      <rect width="64" height="64" rx="12" fill="#0E1E33"/>
      <g transform="translate(32 32) scale(0.64) translate(-30 -40)">
        <path d="M8 58 L8 30 A22 22 0 0 1 52 30 L52 58 L43 58 L43 30 A13 13 0 0 0 17 30 L17 58 Z" fill="#F7F4EE"/>
        <path d="M23 58 L23 27 A7 7 0 0 1 37 27 L37 58 Z" fill="#D8B56B"/>
      </g>
    </svg>
    <h1>Sem conexão</h1>
    <p>
      O Learn precisa do servidor: suas notas moram no seu vault, e a revisão grava nelas —
      não neste aparelho. Assim que a internet voltar, é só tentar de novo.
    </p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
